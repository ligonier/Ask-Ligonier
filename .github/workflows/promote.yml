# ─────────────────────────────────────────────
# CD: Sync Databricks workspace Git folders on merge
# Ensures system prompt is live in the correct workspace
# Triggered when PRs are merged to stage or prod, and on every push to dev
#
# Required GitHub secrets:
#   DATABRICKS_HOST_DEV / DATABRICKS_TOKEN_DEV
#   DATABRICKS_HOST_STAGE / DATABRICKS_TOKEN_STAGE
#   DATABRICKS_HOST_PROD / DATABRICKS_TOKEN_PROD
#   JIRA_EMAIL / JIRA_TOKEN (optional — auto-transitions ticket)
#
# REPO_ID is hardcoded per environment below, not discovered via
# GET /api/2.0/repos?path_prefix=... — that search endpoint returns an empty
# result even for the exact correct path (DATA-4160/DATA-4176, 2026-08-18),
# which made every past sync silently no-op via the "not found — skipping"
# branch while still exiting 0 (green check). GET /api/2.0/repos/{id} by ID
# is reliable; use that instead, and fail the job loudly if the hardcoded ID
# stops resolving (e.g. the Git folder was deleted/recreated) rather than
# silently skipping.
#
# The dev sync uses `push`, not `pull_request: closed` — this branch has no
# PR gating (direct pushes to dev are the norm here), so a PR-closed trigger
# would simply never fire. DATABRICKS_TOKEN_DEV's original value 401'd
# against this API for months — root-caused and fixed under DATA-4311 (the
# org secret held a Databricks Token ID, not the actual token value).
# ─────────────────────────────────────────────

name: CD — Promote

on:
  pull_request:
    types: [closed]
    branches: [stage, prod]
  push:
    branches: [dev]

jobs:

  # ─────────────────────────────────────────
  # Sync Dev Workspace (push to dev)
  # ─────────────────────────────────────────
  sync-dev:
    name: Sync Dev Workspace
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync dev workspace Git folder
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
          EXPECTED_SHA: ${{ github.sha }}
          REPO_ID: "1654705449804841"
        run: |
          set -eo pipefail
          HTTP_STATUS=$(curl -s -o /tmp/repo_check.json -w "%{http_code}" \
            "$DATABRICKS_HOST/api/2.0/repos/$REPO_ID" \
            -H "Authorization: Bearer $DATABRICKS_TOKEN")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ GET /repos/$REPO_ID returned HTTP $HTTP_STATUS (not 200) — see body below. Common causes: wrong REPO_ID, wrong DATABRICKS_HOST_DEV, or a DATABRICKS_TOKEN_DEV that's expired/scoped to a different workspace."
            cat /tmp/repo_check.json
            exit 1
          fi

          # The PATCH request can be accepted (2xx) while the underlying git
          # pull fails asynchronously (e.g. git index.lock contention) with no
          # error surfaced back through this API call — DATA-4160 found this
          # live: promote.yml reported success while the workspace stayed on
          # the previous commit. Poll head_commit_id and fail loudly if it
          # never reaches the pushed commit, instead of trusting the PATCH
          # response alone.
          SYNCED=false
          for ATTEMPT in 1 2 3 4 5 6; do
            curl -sf -X PATCH \
              "$DATABRICKS_HOST/api/2.0/repos/$REPO_ID" \
              -H "Authorization: Bearer $DATABRICKS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"branch":"dev"}' > /dev/null || echo "⚠️  PATCH attempt $ATTEMPT failed — retrying"

            sleep 5
            ACTUAL_SHA=$(curl -sf "$DATABRICKS_HOST/api/2.0/repos/$REPO_ID" \
              -H "Authorization: Bearer $DATABRICKS_TOKEN" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('head_commit_id',''))")

            if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
              SYNCED=true
              break
            fi
            echo "Attempt $ATTEMPT: dev workspace at $ACTUAL_SHA, expected $EXPECTED_SHA — retrying"
          done

          if [ "$SYNCED" != "true" ]; then
            echo "❌ Dev workspace never reached $EXPECTED_SHA after 6 attempts (currently at $ACTUAL_SHA)"
            exit 1
          fi
          echo "✅ Dev workspace synced to $ACTUAL_SHA"

  # ─────────────────────────────────────────
  # Promote to Stage (dev → stage merge)
  # ─────────────────────────────────────────
  promote-to-stage:
    name: Sync Stage Workspace
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'stage'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync stage workspace Git folder
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_STAGE }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_STAGE }}
          EXPECTED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REPO_ID: "2816272582633155"
        run: |
          set -eo pipefail
          curl -sf "$DATABRICKS_HOST/api/2.0/repos/$REPO_ID" \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" > /dev/null || {
            echo "❌ REPO_ID $REPO_ID not found in stage workspace — has the Git folder been deleted/recreated? Update REPO_ID in this workflow."
            exit 1
          }

          # The PATCH request can be accepted (2xx) while the underlying git
          # pull fails asynchronously (e.g. git index.lock contention) with no
          # error surfaced back through this API call — DATA-4160 found this
          # live: promote.yml reported success while the workspace stayed on
          # the previous commit. Poll head_commit_id and fail loudly if it
          # never reaches the merge commit, instead of trusting the PATCH
          # response alone.
          SYNCED=false
          for ATTEMPT in 1 2 3 4 5 6; do
            curl -sf -X PATCH \
              "$DATABRICKS_HOST/api/2.0/repos/$REPO_ID" \
              -H "Authorization: Bearer $DATABRICKS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"branch":"stage"}' > /dev/null || echo "⚠️  PATCH attempt $ATTEMPT failed — retrying"

            sleep 5
            ACTUAL_SHA=$(curl -sf "$DATABRICKS_HOST/api/2.0/repos/$REPO_ID" \
              -H "Authorization: Bearer $DATABRICKS_TOKEN" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('head_commit_id',''))")

            if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
              SYNCED=true
              break
            fi
            echo "Attempt $ATTEMPT: stage workspace at $ACTUAL_SHA, expected $EXPECTED_SHA — retrying"
          done

          if [ "$SYNCED" != "true" ]; then
            echo "❌ Stage workspace never reached $EXPECTED_SHA after 6 attempts (currently at $ACTUAL_SHA)"
            exit 1
          fi
          echo "✅ Stage workspace synced to $ACTUAL_SHA"

  # ─────────────────────────────────────────
  # Promote to Prod (stage → prod merge)
  # ─────────────────────────────────────────
  promote-to-prod:
    name: Sync Prod Workspace
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'prod'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync prod workspace Git folder
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
          EXPECTED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REPO_ID: "1202671141290053"
        run: |
          set -eo pipefail
          curl -sf "$DATABRICKS_HOST/api/2.0/repos/$REPO_ID" \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" > /dev/null || {
            echo "❌ REPO_ID $REPO_ID not found in prod workspace — has the Git folder been deleted/recreated? Update REPO_ID in this workflow."
            exit 1
          }

          # See the matching comment in the "Sync stage workspace Git folder"
          # step above — the PATCH response alone does not prove the pull
          # completed (DATA-4160).
          SYNCED=false
          for ATTEMPT in 1 2 3 4 5 6; do
            curl -sf -X PATCH \
              "$DATABRICKS_HOST/api/2.0/repos/$REPO_ID" \
              -H "Authorization: Bearer $DATABRICKS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"branch":"prod"}' > /dev/null || echo "⚠️  PATCH attempt $ATTEMPT failed — retrying"

            sleep 5
            ACTUAL_SHA=$(curl -sf "$DATABRICKS_HOST/api/2.0/repos/$REPO_ID" \
              -H "Authorization: Bearer $DATABRICKS_TOKEN" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('head_commit_id',''))")

            if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
              SYNCED=true
              break
            fi
            echo "Attempt $ATTEMPT: prod workspace at $ACTUAL_SHA, expected $EXPECTED_SHA — retrying"
          done

          if [ "$SYNCED" != "true" ]; then
            echo "❌ Prod workspace never reached $EXPECTED_SHA after 6 attempts (currently at $ACTUAL_SHA)"
            exit 1
          fi
          echo "✅ Prod workspace synced to $ACTUAL_SHA"

      - name: Transition Jira ticket to Done
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: |
          if [ -z "$JIRA_EMAIL" ] || [ -z "$JIRA_TOKEN" ]; then
            echo "ℹ️ JIRA_EMAIL or JIRA_TOKEN not configured — skipping"
            exit 0
          fi
          JIRA_KEY=$(python3 -c "import json,os,re; ev=json.load(open(os.environ['GITHUB_EVENT_PATH'])); pr=ev.get('pull_request',{}) or {}; t=(pr.get('title') or '')+' '+(pr.get('body') or ''); m=re.search(r'DATA-[0-9]+',t); print(m.group(0) if m else '')")
          if [ -z "$JIRA_KEY" ]; then
            echo "ℹ️ No Jira issue key found in PR title or body — skipping"
            exit 0
          fi
          echo "Transitioning $JIRA_KEY to Done..."
          TRANSITIONS=$(curl -sf -u "$JIRA_EMAIL:$JIRA_TOKEN" \
            "https://ligonier.atlassian.net/rest/api/3/issue/$JIRA_KEY/transitions") || {
            echo "⚠️ Jira API unreachable — skipping transition"
            exit 0
          }
          DONE_ID=$(echo "$TRANSITIONS" | python3 -c \
            "import sys,json; t=json.load(sys.stdin)['transitions']; print(next((x['id'] for x in t if x['name']=='Done'),''))")
          if [ -z "$DONE_ID" ]; then
            echo "⚠️ Done transition not found for $JIRA_KEY — skipping"
            exit 0
          fi
          curl -sf -X POST \
            -u "$JIRA_EMAIL:$JIRA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"transition\":{\"id\":\"$DONE_ID\"}}" \
            "https://ligonier.atlassian.net/rest/api/3/issue/$JIRA_KEY/transitions" || {
            echo "⚠️ Jira transition request failed — non-fatal"
            exit 0
          }
          echo "✅ $JIRA_KEY transitioned to Done"
